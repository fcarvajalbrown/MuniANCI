[package]
name        = "muniani-core"
description = "Core scanner and compliance engine for MuniANCI — Ley 21.663 / ANCI Chile"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true

[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
rayon       = { workspace = true }
thiserror   = { workspace = true }
anyhow      = { workspace = true }
chrono      = { workspace = true }
socket2     = { workspace = true }
dns-lookup  = { workspace = true }
printpdf    = { workspace = true }

# Windows-only: WMI for software inventory + BitLocker status
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.1", features = [
    "Win32_NetworkManagement_WNet",
    "Win32_Storage_FileSystem",
    "Win32_System_Wmi",
    "Win32_Foundation",
] }

# Unix-only: nix for mount enumeration
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.1", features = ["mount", "net"] }

[dev-dependencies]
tempfile = "3"