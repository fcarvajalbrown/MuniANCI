[package]
name        = "muniani-core"
description = "Core scanner and compliance engine for MuniANCI — Ley 21.663 / ANCI Chile"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true

[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
rayon       = { workspace = true }
thiserror   = { workspace = true }
anyhow      = { workspace = true }
chrono      = { workspace = true }
socket2     = { workspace = true }
dns-lookup  = { workspace = true }
lopdf = { workspace = true}
uuid        = { workspace = true }
rusqlite    = { workspace = true }
native-tls = "0.2"
# Pure-Rust inflate for the embedded CVE index. `rust_backend` evita enlazar
# zlib/liblzma en un binario que se instala en PCs municipales.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Windows-only: WMI for software inventory + BitLocker status, IP Helper for
# native host discovery.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.1", features = [
    "Win32_NetworkManagement_WNet",
    "Win32_Storage_FileSystem",
    "Win32_System_Wmi",
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    # SendARP, IcmpCreateFile, IcmpSendEcho2, ICMP_ECHO_REPLY.
    "Win32_NetworkManagement_IpHelper",
    # No se usa directo: `IcmpSendEcho2` esta tras `#[cfg(feature =
    # "Win32_System_IO")]` porque su parametro `apcroutine: PIO_APC_ROUTINE`
    # vive ahi. Sin esta feature el error dice "cannot find function
    # IcmpSendEcho2" y no explica por que.
    "Win32_System_IO",
] }

# Unix-only: nix for mount enumeration. `fs` es la que expone `sys::statvfs`,
# que os_abstraction/linux.rs usa para el espacio libre de cada punto de montaje.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.1", features = ["mount", "net", "fs"] }

[dev-dependencies]
tempfile = "3"
native-tls = "0.2"
serde_json = "1"