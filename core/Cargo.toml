[package]
name        = "muniani-core"
description = "Core scanner and compliance engine for MuniANCI — Ley 21.663 / ANCI Chile"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true

[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
rayon       = { workspace = true }
thiserror   = { workspace = true }
anyhow      = { workspace = true }
chrono      = { workspace = true }
socket2     = { workspace = true }
dns-lookup  = { workspace = true }
lopdf = { workspace = true}
native-tls = "0.2"
# Pure-Rust inflate for the embedded CVE index. `rust_backend` evita enlazar
# zlib/liblzma en un binario que se instala en PCs municipales.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Windows-only: WMI for software inventory + BitLocker status
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.1", features = [
    "Win32_NetworkManagement_WNet",
    "Win32_Storage_FileSystem",
    "Win32_System_Wmi",
    "Win32_Foundation",
    "Win32_System_Registry",          
    "Win32_System_SystemInformation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

# Unix-only: nix for mount enumeration
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.1", features = ["mount", "net"] }

[dev-dependencies]
tempfile = "3"
native-tls = "0.2"
serde_json = "1"