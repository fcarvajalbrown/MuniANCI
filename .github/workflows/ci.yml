name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Para poder verificar el empaquetado sin tener que crear un tag.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Build & test (Rust, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: gui/frontend/pnpm-lock.yaml
      # tauri::generate_context! embeds gui/frontend/dist at compile time, so the
      # frontend must be built before the gui crate compiles.
      - name: Build frontend
        working-directory: gui/frontend
        run: pnpm install --frozen-lockfile && pnpm run build
      - name: cargo build
        run: cargo build --workspace --locked
      - name: cargo test
        run: cargo test --workspace --locked
      # Compila la app Tauri sin generar instaladores. Es barato porque reutiliza
      # lo ya compilado, y ejerce el `beforeBuildCommand` de tauri.conf.json, que
      # es justo lo que nadie estaba ejerciendo: hasta 0.7.0 tenia mal la ruta y
      # `cargo tauri build` fallaba antes de compilar, sin que la CI lo notara.
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli
      - name: cargo tauri build --no-bundle (verifica el empaquetado)
        working-directory: gui
        run: cargo tauri build --no-bundle

  # El producto se distribuye para Windows, pero core tiene ramas
  # #[cfg(not(windows))] y el README ofrece Linux. Hasta 0.5.0 nada las
  # compilaba, asi que `mod unix;` apuntaba a un archivo inexistente sin que
  # ninguna corrida lo notara. `cargo check` basta: interesa que el codigo
  # compile, no producir un binario que nadie distribuye.
  rust-linux:
    name: Check (Rust, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rusqlite viaja con `bundled` (compila SQLite desde C) y native-tls usa
      # OpenSSL en Linux. El runner ya trae build-essential, pkg-config y
      # libssl-dev; se declara aca para que la dependencia quede a la vista.
      - name: cargo check (core + cli, sin la GUI)
        run: cargo check --locked -p munigpt-core -p munigpt-cli --all-targets

  rust-audit:
    name: Dependency audit (Rust) — blocking gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      # cargo-audit owns the VULNERABILITY gate. The two ignored IDs are transitive
      # quick-xml DoS advisories reachable only via Tauri's plist parser (macOS
      # bundle metadata), pinned by tauri -> plist ^0.38; not reachable with attacker
      # input in this offline desktop app. Remove when Tauri bumps plist past
      # quick-xml >= 0.41. Any OTHER vulnerability still fails the build.
      - name: cargo audit (RustSec vulnerabilities)
        run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
      # cargo-deny owns licenses + bans + sources (advisories handled above).
      - name: cargo deny (licenses, bans, sources)
        run: cargo deny check licenses bans sources

  python-audit:
    name: Dependency audit (Python) — blocking gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: pip-audit (Asistente backend runtime deps)
        run: pip-audit -r assistant/backend/requirements.txt

  sbom:
    name: SBOM (SPDX + CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx,cargo-sbom
      - name: Prepare output dir
        run: mkdir -p sbom
      - name: Rust SBOM — SPDX (JSON, ISO-aligned for public sector)
        run: cargo sbom --output-format spdx_json_2_3 > sbom/munigpt-rust.spdx.json
      - name: Rust SBOM — CycloneDX (per-crate JSON)
        run: |
          cargo cyclonedx --format json --all
          find . -name '*.cdx.json' -not -path './sbom/*' -exec mv {} sbom/ \;
      - name: Python SBOM — CycloneDX (Asistente backend)
        run: |
          python -m pip install cyclonedx-bom
          cyclonedx-py requirements assistant/backend/requirements.txt \
            --output-format JSON --output-file sbom/munigpt-python.cdx.json
      - name: Upload SBOM bundle
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  # Instaladores firmables para una release. Solo en tags y a pedido: bundlear
  # NSIS y WiX es la parte lenta, y no aporta en cada push a main, donde el job
  # de arriba ya verifica que el empaquetado no se rompio.
  package:
    name: Instaladores (Windows)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: gui/frontend/pnpm-lock.yaml
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli
      - name: Instalar dependencias del frontend
        working-directory: gui/frontend
        run: pnpm install --frozen-lockfile
      - name: cargo tauri build
        working-directory: gui
        run: cargo tauri build
      # El SHA256 viaja junto al instalador por la misma razon que el paquete de
      # evidencia lleva su manifiesto: quien lo recibe tiene que poder verificar
      # que es el archivo que se publico, con lo que Windows ya trae.
      - name: Calcular SHA256
        shell: pwsh
        run: |
          $dir = "target/release/bundle"
          Get-ChildItem -Path $dir -Recurse -Include *.exe,*.msi |
            ForEach-Object {
              $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
              "$h  $($_.Name)"
            } | Tee-Object -FilePath SHA256SUMS.txt
      - name: Publicar instaladores como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: instaladores-windows
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/msi/*.msi
            SHA256SUMS.txt
          if-no-files-found: error
          # Pesan ~200 MB cada uno; no hace falta guardarlos indefinidamente.
          retention-days: 30
