[workspace]
members = [
    "core",
    "cli",
    # "gui",  # uncomment when scaffolding v0.2
]
resolver = "2"

[workspace.package]
version    = "0.1.0"
edition    = "2024"
authors = ["Felipe Carvajal Brown <fcarvajalbrown@gmail.com>"]
license    = "MIT"

[workspace.dependencies]
# serialization
serde       = { version = "1",  features = ["derive"] }
serde_json  = "1"

# parallelism
rayon       = "1"

# error handling
thiserror   = "2.0.17"
anyhow      = "1"

# time
chrono      = { version = "0.4", features = ["serde"] }

# networking / probes
socket2     = "0.6.2"
dns-lookup  = "3.0.0"

# PDF generation
printpdf    = "0.9.0"

# CLI (only muniani-cli needs this, declared here for version pinning)
clap        = { version = "4", features = ["derive"] }

[profile.release]
opt-level   = 3
strip       = true
lto         = true
codegen-units = 1