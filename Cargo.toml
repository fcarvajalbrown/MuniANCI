[workspace]
members = [
    "core",
    "cli",
    "gui",
    "tools/nvd-index",
    "tools/notas-release",
]
resolver = "2"

[workspace.package]
version    = "0.8.0"
edition    = "2024"
authors = ["Felipe Carvajal Brown <fcarvajalbrown@gmail.com>"]
license    = "MIT"

[workspace.dependencies]
# serialization
serde       = { version = "1.0.229",  features = ["derive"] }
serde_json  = "1.0.151"

# parallelism
rayon       = "1"

# error handling
thiserror   = "2.0.19"
anyhow      = "1.0.104"

# time
chrono      = { version = "0.4.45", features = ["serde"] }

# networking / probes
socket2     = "0.6.5"
dns-lookup  = "3.0.0"

# PDF generation
lopdf = "0.42"

# Identificadores del export OSCAL. Solo v5 (deterministico a partir de un
# nombre): el mismo hallazgo tiene que conservar su UUID entre escaneos para que
# el historico por comuna pueda seguirlo.
uuid = { version = "1.24.0", default-features = false, features = ["v5", "serde"] }

# Historico de evaluaciones. `bundled` compila SQLite desde fuente dentro del
# binario: cero instalacion y cero dependencia externa en el PC municipal.
# SQLite es de dominio publico; rusqlite y libsqlite3-sys son MIT.
rusqlite = { version = "0.40.1", features = ["bundled", "chrono"] }

# Sello de integridad del paquete de evidencia. RustCrypto, MIT/Apache, Rust
# puro. Se fija la version: el manifiesto que produce va a manos de la ANCI y no
# puede cambiar de algoritmo por una actualizacion silenciosa.
sha2 = "0.11.0"

# Hash de la contrasena del panel de TI. RustCrypto, MIT/Apache, Rust puro.
# Argon2id es el algoritmo que recomienda la RFC 9106 para contrasenas.
argon2 = { version = "0.5", features = ["std"] }

# Metricas de las fuentes embebidas en el PDF. Rust puro, MIT/Apache. Solo se usa
# para leer anchos de avance y metricas verticales del TTF; no dibuja nada.
ttf-parser = "0.25"

# CLI (only muniani-cli needs this, declared here for version pinning)
clap        = { version = "4.6.5", features = ["derive"] }

[profile.dev]
# Solo tablas de linea en vez de informacion de depuracion completa. Lo que este
# proyecto lee de un build de desarrollo son panics y backtraces, y para eso alcanza
# con archivo y linea; la informacion a nivel de variable es lo que produce el grueso
# de los gigabytes. Medido el 2026-07-25: target/debug habia llegado a 46,74 GB, de un
# repositorio de 57,97 GB. Lo que se pierde es recorrer variables en un depurador; si
# alguna vez hace falta, se sube a `debug = true` para esa sesion.
debug = "line-tables-only"

[profile.release]
opt-level   = 3
strip       = true
lto         = true
codegen-units = 1